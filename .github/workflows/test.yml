name: Test

on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 9 * * 1"

jobs:
  contract-test:
    name: Contract Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    uses: Bandwidth-Samples/sample-app-tooling/.github/workflows/php.yml@main
    with:
      sample: voice-record
      os: ${{ matrix.os }}
